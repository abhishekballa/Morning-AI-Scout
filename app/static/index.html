<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning AI Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="14" r="5" fill="currentColor"/><path d="M12 3v3M4.2 6.2l2.1 2.1M19.8 6.2l-2.1 2.1M2 14h3M19 14h3M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </span>
      <div>
        <h1>Morning AI Scout</h1>
        <p id="nextRun" class="sub">Loading…</p>
      </div>
    </div>
    <div class="actions">
      <button id="syncBtn" class="btn" type="button" title="Download the newest reports from GitHub" aria-label="Get latest reports">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label-long">Get latest</span>
      </button>
      <a id="runBtn" class="btn primary" target="_blank" rel="noopener" title="Opens the routine on claude.ai, where you can press Run now">
        Run now
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Reports">
      <h2 class="side-title">Reports</h2>
      <div id="runList" class="run-list"></div>
    </nav>

    <main id="report" class="report" tabindex="-1">
      <div class="empty">Loading reports…</div>
    </main>

    <aside class="teach">
      <section class="panel">
        <h2>Teach the scout</h2>
        <p id="teachHint" class="hint">Your feedback becomes a dated rule in <code>memory.md</code> and is pushed to GitHub, so tomorrow's 8 AM run follows it.</p>
        <form id="feedbackForm">
          <label for="feedback" class="sr-only">Your feedback</label>
          <textarea id="feedback" rows="4" maxlength="400" placeholder="e.g. Always include at least one free AI video tool"></textarea>
          <div class="form-row">
            <span id="charCount" class="muted small">0 / 400</span>
            <button id="saveBtn" class="btn primary" type="submit">Save rule</button>
          </div>
        </form>
      </section>
      <section class="panel">
        <h2>Rules it follows <span id="ruleCount" class="count"></span></h2>
        <ul id="rules" class="rules"></ul>
        <a id="editRules" class="edit-rules" target="_blank" rel="noopener" hidden>Edit rules on GitHub</a>
      </section>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
